name: antriaja

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [private]
    # No `ports:` on purpose: the database is reachable only from the private network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Empty defaults keep `compose up` working before admin sign-in is configured.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      STAFF_COOKIE_SECRET: ${STAFF_COOKIE_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000" # local only; compose.prod.yaml removes this and joins `web`
    networks: [private]

  # Run with: docker compose run --rm test   (see `pnpm test:docker`).
  # Uses a separate `<db>_test` database; the global setup refuses any other name.
  test:
    profiles: [test]
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
    networks: [private]

networks:
  private:

volumes:
  db-data:
