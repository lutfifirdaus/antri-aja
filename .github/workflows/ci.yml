name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: antriaja_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d antriaja_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway service-container credentials; not a real secret.
      DATABASE_URL: postgresql://ci:ci-only-throwaway@localhost:5432/antriaja_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # scan the full history
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner -v

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create throwaway .env
        run: |
          {
            echo "POSTGRES_USER=ci"
            echo "POSTGRES_DB=antriaja"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
          } > .env
      - run: docker compose up -d --build --wait
      - name: Health endpoint answers with the database up
        run: |
          curl -fsS http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"db":"up"'
      - name: Database is not published to the host
        run: |
          ! docker compose ps --format json db | grep -q '"PublishedPort":[1-9]'
      - if: failure()
        run: docker compose logs --no-color
